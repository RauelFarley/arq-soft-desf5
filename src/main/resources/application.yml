spring:
  application:
    name: product-catalog-api
  datasource:
    url: jdbc:h2:mem:productdb
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
